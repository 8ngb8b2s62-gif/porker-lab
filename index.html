<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c0e12"><link rel="manifest" href="manifest.webmanifest"><title>POKER LAB · Table Trainer</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#f7f8fa;background:#0c0e12}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer}header{padding:calc(env(safe-area-inset-top) + 13px) 16px 12px;display:flex;justify-content:space-between;align-items:center;background:#14171e;border-bottom:1px solid #272b33}header strong{font-size:19px;letter-spacing:1px}header small{color:#aab1c0}.pill{border:1px solid #1ba58e;border-radius:7px;color:#44d9c1;padding:7px 10px;font-size:12px}.controls{display:flex;gap:8px;padding:12px;justify-content:center;flex-wrap:wrap}select,.secondary{background:#1b2029;color:#fff;border:1px solid #3b4250;border-radius:9px;padding:9px}.street{display:flex;gap:5px;padding:0 12px}.street span{flex:1;text-align:center;font-size:11px;padding:9px 2px;border-bottom:3px solid #343b45;color:#838b9a}.street .active{border-color:#23c6a5;color:#fff}.meta{display:flex;justify-content:space-between;padding:12px 15px;color:#aeb7c5;font-size:13px}.meta b{color:#fff}.felt{height:min(96vw,440px);max-height:440px;position:relative;margin:0 10px 8px;border:5px solid #333942;border-radius:48% / 43%;background:radial-gradient(ellipse,#162c2a 0%,#11201f 68%,#101819 100%);box-shadow:inset 0 0 0 3px #0a1012}.seat{position:absolute;transform:translate(-50%,-50%);text-align:center;min-width:59px}.seat .person{border:2px solid #555e69;border-radius:40px;background:#242932;padding:7px 3px;min-width:57px;font-size:12px;line-height:1.15;font-weight:700}.seat .person.hero{border-color:#20c7a8;box-shadow:0 0 0 2px #0c675b}.seat .person.active{border-color:#f5bd56}.seat .stack{font-size:11px;color:#b8c0c9}.seat .act{font-size:10px;color:#f5c36b;white-space:nowrap;position:absolute;top:100%;left:50%;transform:translateX(-50%)}.center{position:absolute;top:49%;left:50%;transform:translate(-50%,-50%);text-align:center;width:78%}.board{display:flex;justify-content:center;gap:4px;min-height:55px}.card{width:35px;height:49px;background:#f5f6f7;border-radius:5px;color:#10141a;display:grid;place-items:center;font-weight:800;font-size:18px;box-shadow:0 2px 5px #0008}.red{color:#d53445}.back{background:linear-gradient(135deg,#263ac5,#0d236c);border:2px solid #e3e5ff;color:#dbe3ff}.pot{margin-top:10px;color:#dce5e7;font-size:12px}.pot strong{font-size:21px;color:#fff}.hero-hand{display:flex;justify-content:center;gap:5px;margin-top:9px}.hero-hand .card{width:42px;height:56px;font-size:23px}.question{text-align:center;padding:9px 15px 12px;min-height:72px}.question b{font-size:16px}.question p{color:#a8b2bf;font-size:12px;margin:6px 0 0}.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;padding:0 10px}.actions button{border:0;border-radius:8px;padding:17px 2px;color:#fff;font-weight:800;font-size:14px;background:#285f9a}.actions button:nth-child(2){background:#d73f42}.actions button:nth-child(3){background:#7f2528}.actions button:disabled{opacity:.45}.result{margin:12px 10px;padding:14px;border:1px solid #3b4652;background:#1b2029;border-radius:12px}.result h3{margin:0 0 8px;font-size:16px}.result p{margin:7px 0;line-height:1.55;font-size:13px;color:#d3d9e1}.result .note{font-size:11px;color:#9aa5b2}.next{width:100%;padding:13px;background:#14a78e;color:#06130f;border:0;border-radius:9px;font-weight:800;margin-top:9px}.footer{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 26px;color:#a3abb8;font-size:12px}.footer button{background:transparent;border:1px solid #59616e;color:#e7edf4;border-radius:7px;padding:8px}.hide{display:none!important}@media(min-width:600px){main{max-width:570px;margin:auto}.felt{height:440px}}
</style></head><body><header><div><strong>♠ POKER LAB</strong><br><small>TABLE TRAINER · v0.2</small></div><div class="pill" id="score">正答 0 / 0</div></header><main><div class="controls"><select id="mode" aria-label="モード"><option value="tournament">トーナメント</option><option value="cash">キャッシュ</option></select><select id="depth" aria-label="スタック"><option value="mixed">スタック：混合</option><option value="short">ショート中心</option><option value="deep">ディープ中心</option></select><button class="secondary" id="reset">最初から</button></div><div class="street" id="streets"></div><div class="meta"><span id="spot">9-max · BTN vs BB</span><span id="blinds">BB ante · 40BB effective</span></div><div class="felt" id="felt"><div class="center"><div class="board" id="board"></div><div class="pot">POT <strong id="pot">5.5 BB</strong></div><div class="hero-hand" id="hand"></div></div></div><div class="question"><b id="question"></b><p id="context"></p></div><div class="actions" id="actions"></div><div class="result hide" id="result"><h3 id="resultTitle"></h3><p id="resultBody"></p><p class="note">※ 教育用の簡易戦略例。ソルバー検証済みのGTO頻度ではありません。相手レンジやサイズによって最適解は変化します。</p><button class="next" id="next">次の局面へ →</button></div><div class="footer"><span>回答履歴はこの端末に保存</span><button id="clear">履歴リセット</button></div></main><script>
const S=[
{street:0,mode:'tournament',bb:18,hero:'UTG',hand:['A♠','9♠'],board:[],pot:2.5,spot:'9-max · UTG · 18BB',q:'UTGでA9s。最初のアクションは？',ctx:'BBアンティあり · 全員フォールドで回ってきた',options:['FOLD','RAISE 2BB','ALL-IN'],correct:1,why:'18BBのUTG A9sは境界的なハンド。標準的な9-max想定ではフォールドも有力で、テーブル条件次第で小さくオープンする。ここでは相手がタイトで後方の3betが少ない前提のオープン練習。',cave:'固定のGTO正解ではありません。',acts:{UTG:'HERO'}},
{street:0,mode:'tournament',bb:11,hero:'UTG',hand:['A♠','9♠'],board:[],pot:2.5,spot:'7-max · UTG · 11BB',q:'11BBのUTG、A9s。どうする？',ctx:'BBアンティあり · ICMなしのチップEV想定',options:['FOLD','RAISE 2BB','ALL-IN'],correct:2,why:'11BBではオープン後の残りが少なく、プッシュ/フォールド戦略が重要。7-max UTGのA9sは相手のコールレンジ次第でオールイン候補。ICMが強い局面なら変わる。',acts:{UTG:'HERO'}},
{street:0,mode:'cash',bb:100,hero:'BTN',hand:['A♥','J♥'],board:[],pot:3.5,spot:'6-max · BTN · 100BB',q:'COが2.5BBオープン。BTNのAJsは？',ctx:'レーキありの一般的なキャッシュ想定',options:['FOLD','CALL 2.5BB','3BET 8BB'],correct:2,why:'AJsはCOのオープンに対しバリューとフォールドエクイティを兼ねた3betが有力。コールを混ぜる戦略もある。',acts:{CO:'RAISE 2.5'}},
{street:1,mode:'cash',bb:100,hero:'BTN',hand:['A♠','J♠'],board:['J♥','8♠','4♠'],pot:19,spot:'BTN vs BB · 3bet pot',q:'BBチェック。トップペア＋ナッツFDは？',ctx:'プリフロップ：BTN 3bet、BBコール',options:['CHECK','BET 6BB','BET 17BB'],correct:1,why:'強いトップペアとナッツフラッシュドローでバリュー・プロテクションを狙える。小さめのCBはレンジ全体で使いやすい候補。',acts:{BB:'CHECK'}},
{street:1,mode:'tournament',bb:35,hero:'BB',hand:['K♣','Q♣'],board:['Q♦','7♠','2♥'],pot:5.5,spot:'BB vs BTN · single raised',q:'BTNが1.8BBベット。BBのKQは？',ctx:'BTN 2.2BBオープン、BBコール · フロップ',options:['FOLD','CALL 1.8BB','RAISE 7BB'],correct:1,why:'トップペアの良いキッカーはコールで相手のブラフを残しやすい。相手のCBレンジに対して過剰なレイズは不要なことが多い。',acts:{BTN:'BET 1.8'}},
{street:2,mode:'cash',bb:100,hero:'BTN',hand:['A♠','J♠'],board:['J♥','8♠','4♠','2♦'],pot:31,spot:'BTN vs BB · 3bet pot',q:'ターン2♦。BBチェック。どうする？',ctx:'フロップ：BTN小さくCB、BBコール',options:['CHECK','BET 12BB','ALL-IN'],correct:1,why:'トップペア＋ナッツFDで引き続きバリューを取りやすい。相手のチェックレイズ頻度が高い場合はチェックも候補。',acts:{BB:'CHECK'}},
{street:2,mode:'tournament',bb:40,hero:'BB',hand:['9♣','9♦'],board:['K♥','7♠','3♦','2♣'],pot:13,spot:'BB vs CO · 40BB',q:'COがターンで9BBベット。99は？',ctx:'フロップはBBチェック、CO小CB、BBコール',options:['FOLD','CALL 9BB','RAISE 25BB'],correct:0,why:'Kハイで大きい2バレルに対し99はショーダウン価値があってもブラフキャッチとして弱くなりやすい。相手の2バレル頻度が高ければコールを再検討。',acts:{CO:'BET 9'}},
{street:3,mode:'cash',bb:100,hero:'BTN',hand:['A♠','J♠'],board:['J♥','8♠','4♠','2♦','3♠'],pot:55,spot:'BTN vs BB · river',q:'リバーでナッツフラッシュ完成。BBチェックは？',ctx:'相手の残りスタックは約73BB',options:['CHECK','BET 25BB','ALL-IN 73BB'],correct:1,why:'ナッツフラッシュは明確なバリューベット。相手のコールレンジが広い想定では中〜大サイズを選べる。オールインも相手次第で候補。',acts:{BB:'CHECK'}},
{street:3,mode:'tournament',bb:30,hero:'BB',hand:['K♣','Q♣'],board:['Q♦','7♠','2♥','4♠','A♦'],pot:20,spot:'BB vs BTN · river',q:'Aが落ちてBTNが15BBベット。どうする？',ctx:'フロップ・ターンでBBがコール',options:['FOLD','CALL 15BB','ALL-IN'],correct:0,why:'リバーAはBTN側のバリューを増やし、KQは大きなベットへのキャッチが難しくなる。相手が過剰にブラフするならコールを検討。',acts:{BTN:'BET 15'}}
];
const positions=[['UTG',50,96],['UTG1',23,83],['LJ',9,56],['HJ',16,22],['CO',50,7],['BTN',84,22],['SB',92,56],['BB',77,83]];const symbols=['♠','♥','♦','♣'];let index=0,answered=false;let stats=JSON.parse(localStorage.getItem('pl_stats_v02')||'{"correct":0,"total":0}');function card(v){let suit=v.slice(-1),rank=v.slice(0,-1);return `<div class="card ${'♥♦'.includes(suit)?'red':''}">${rank}<small>${suit}</small></div>`}function render(){const s=S[index];answered=false;document.getElementById('result').classList.add('hide');document.getElementById('mode').value=s.mode;document.getElementById('streets').innerHTML=['PREFLOP','FLOP','TURN','RIVER'].map((x,i)=>`<span class="${i===s.street?'active':''}">${x}</span>`).join('');document.getElementById('spot').textContent=s.spot;document.getElementById('blinds').textContent=`${s.bb}BB effective · ${s.mode==='cash'?'CASH':'MTT'}`;document.getElementById('felt').querySelectorAll('.seat').forEach(e=>e.remove());positions.forEach(([pos,x,y])=>{let e=document.createElement('div');e.className='seat';e.style.left=x+'%';e.style.top=y+'%';e.innerHTML=`<div class="person ${pos===s.hero?'hero':''} ${s.acts[pos]?'active':''}">${pos}<div class="stack">${s.bb} BB</div></div><div class="act">${s.acts[pos]||''}</div>`;document.getElementById('felt').appendChild(e)});document.getElementById('board').innerHTML=s.board.length?s.board.map(card).join(''):'<div style="color:#849a99;font-size:12px;padding:15px">PREFLOP</div>';document.getElementById('hand').innerHTML=s.hand.map(card).join('');document.getElementById('pot').textContent=s.pot+' BB';document.getElementById('question').textContent=s.q;document.getElementById('context').textContent=s.ctx;document.getElementById('actions').innerHTML=s.options.map((a,i)=>`<button data-i="${i}">${a}</button>`).join('');document.querySelectorAll('#actions button').forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)));document.getElementById('score').textContent=`正答 ${stats.correct} / ${stats.total}`}
function answer(i){if(answered)return;answered=true;const s=S[index],good=i===s.correct;stats.total++;if(good)stats.correct++;localStorage.setItem('pl_stats_v02',JSON.stringify(stats));document.getElementById('score').textContent=`正答 ${stats.correct} / ${stats.total}`;document.querySelectorAll('#actions button').forEach(b=>b.disabled=true);document.getElementById('resultTitle').textContent=good?'✓ 推奨アクションと一致':'△ 推奨アクションを確認';document.getElementById('resultTitle').style.color=good?'#44d9c1':'#f6c271';document.getElementById('resultBody').textContent=`この問題の推奨：${s.options[s.correct]}。${s.why}`;document.getElementById('result').classList.remove('hide');document.getElementById('next').scrollIntoView({block:'nearest',behavior:'smooth'})}
document.getElementById('next').onclick=()=>{const mode=document.getElementById('mode').value;let candidates=S.map((s,i)=>i).filter(i=>S[i].mode===mode&&i!==index);let next=candidates.find(i=>S[i].street===((S[index].street+1)%4));index=next??candidates[0]??0;render()};document.getElementById('reset').onclick=()=>{index=0;render()};document.getElementById('mode').onchange=e=>{index=S.findIndex(s=>s.mode===e.target.value);render()};document.getElementById('depth').onchange=e=>{const subset=S.findIndex(s=>e.target.value==='short'?s.bb<=18:e.target.value==='deep'?s.bb>=100:true);index=Math.max(0,subset);render()};document.getElementById('clear').onclick=()=>{if(confirm('学習履歴をリセットしますか？')){stats={correct:0,total:0};localStorage.setItem('pl_stats_v02',JSON.stringify(stats));render()}};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
</script></body></html>
